<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="B-BOX 製品検査表 (B-BOX Steel Product Inspection Sheet System)" />
  <title>B - B O X 製 品 検 査 表 - 製品検査表システム</title>

  <!-- Google Fonts: Noto Sans JP, Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="src/style.css" />
</head>

<body>

  <!-- APP CONTROL BAR (No-print) -->
  <div class="app-toolbar no-print">
    <div class="toolbar-brand">
      <i class="fa-solid fa-file-invoice"></i> B-BOX 製品検査表システム
    </div>
    <div class="toolbar-actions">
      <button id="btnLoadSample" class="btn btn-sm btn-secondary">
        <i class="fa-solid fa-rotate-right"></i> サンプルデータ読み込み (Load Sample Data)
      </button>
      <button id="btnCalculate" class="btn btn-sm btn-primary">
        <i class="fa-solid fa-calculator"></i> 自動計算 (Calculate Diff)
      </button>
      <button id="btnPrint" class="btn btn-sm btn-success">
        <i class="fa-solid fa-print"></i> 印刷 / PDF出力 (Print)
      </button>
    </div>
  </div>

  <!-- MAIN INSPECTION SHEET CONTAINER -->
  <div class="sheet-container">

    <!-- SHEET HEADER -->
    <header class="sheet-header">
      <div class="header-left">
        <div class="header-row">
          <span class="header-label">受注No. :</span>
          <div class="order-box">
            <input type="text" id="orderNo" value="25-1050" class="input-flat order-input" />
          </div>
        </div>
        <div class="header-row">
          <span class="header-label">工事名 :</span>
          <span class="header-value-underline">
            <input type="text" id="projectName" value="八重洲二丁目地区再開発事業新築工事(1節)" class="input-flat full-w-input" />
          </span>
        </div>
        <div class="header-row">
          <span class="header-label">持込先 :</span>
          <span class="header-value-underline">
            <input type="text" id="supplierName" value="株式会社 北川組鉄工所" class="input-flat full-w-input" />
          </span>
        </div>
      </div>

      <div class="header-center">
        <h1 class="sheet-main-title">B - B O X 製 品 検 査 表</h1>
      </div>

      <div class="header-right">
        <span class="page-no">No. <input type="text" id="pageCurrent" value="1" class="page-input" /> / <input type="text" id="pageTotal" value="19" class="page-input" /></span>
      </div>
    </header>

    <!-- MAIN INSPECTION FORM TABLE -->
    <div class="table-responsive">
      <table class="bbox-inspection-table">

        <!-- TOP SECTION HEADERS -->
        <thead>
          <tr class="th-main-row">
            <th class="col-hinban" rowspan="2">品番</th>
            <th class="col-mark" rowspan="2">
              <div class="th-mark-title">柱マーク</div>
              <div class="th-sub-dim">寸法 : W × F × t1 / t2 × L</div>
            </th>
            <th class="col-zenchou" colspan="2">全長</th>
            <th class="col-diaphragm-header" colspan="10">ダイアフラム位置 （ 累積 ）</th>
          </tr>
          <tr class="th-sub-num-row">
            <th colspan="2" class="th-sub-l">L</th>
            <th class="dia-lbl-col"></th>
            <th class="dia-col">1</th>
            <th class="dia-col">2</th>
            <th class="dia-col">3</th>
            <th class="dia-col">4</th>
            <th class="dia-col">5</th>
            <th class="dia-col">6</th>
            <th class="dia-col">7</th>
            <th class="dia-col">8</th>
            <th class="dia-col">9</th>
          </tr>
        </thead>

        <tbody>

          <!-- ROW 1: 設計値 -->
          <tr>
            <td rowspan="3" class="td-hinban text-center">
              <input type="text" id="itemNo" value="①-1" class="input-cell text-center font-bold" />
            </td>
            <td rowspan="3" class="td-mark text-center">
              <input type="text" id="columnMark" value="K-1CX5Y14" class="input-cell text-center font-bold font-lg" />
            </td>

            <!-- 全長 設計値 -->
            <td class="td-lbl">設計値</td>
            <td class="td-num">
              <input type="number" step="0.1" id="lenDesign" value="7003.0" class="input-cell text-center calc-trigger" />
            </td>

            <!-- ダイアフラム 設計値 -->
            <td class="td-lbl">設計値</td>
            <td class="td-num"><input type="number" step="0.1" id="dia1_design" value="1253.0" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia2_design" value="2257.0" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia3_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia4_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia5_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia6_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia7_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia8_design" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia9_design" value="" class="input-cell text-center calc-trigger" /></td>
          </tr>

          <!-- ROW 2: 実測値 -->
          <tr>
            <!-- 全長 実測値 -->
            <td class="td-lbl">実測値</td>
            <td class="td-num">
              <input type="number" step="0.1" id="lenActual" value="7006.0" class="input-cell text-center calc-trigger" />
            </td>

            <!-- ダイアフラム 実測値 -->
            <td class="td-lbl">実測値</td>
            <td class="td-num"><input type="number" step="0.1" id="dia1_actual" value="1254.0" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia2_actual" value="2256.0" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia3_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia4_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia5_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia6_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia7_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia8_actual" value="" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="dia9_actual" value="" class="input-cell text-center calc-trigger" /></td>
          </tr>

          <!-- ROW 3: 許容値 (RED) -->
          <tr>
            <!-- 全長 許容値 -->
            <td class="td-lbl text-red">許容値</td>
            <td class="td-num text-red">
              <input type="text" id="lenTol" value="±3.0" class="input-cell text-center text-red font-bold calc-trigger" />
            </td>

            <!-- ダイアフラム 許容値 -->
            <td class="td-lbl text-red">許容値</td>
            <td class="td-num text-red"><input type="text" id="dia1_tol" value="±3.0" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia2_tol" value="±3.0" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia3_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia4_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia5_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia6_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia7_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia8_tol" value="" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="dia9_tol" value="" class="input-cell text-center text-red font-bold" /></td>
          </tr>

          <!-- ROW 4: 差 AND DIMENSION FORMULA AT BOTTOM -->
          <tr>
            <td class="td-square-cell text-center">
              <input type="text" value="□" class="input-cell text-center square-input" />
            </td>
            <td class="td-dim-spec text-left">
              <input type="text" id="dimSpec" value="950 × 950 × 50 / 50 × 7,003" class="input-cell dim-spec-input" />
            </td>

            <!-- 全長 差 -->
            <td class="td-lbl">差</td>
            <td class="td-num">
              <input type="text" id="lenDiff" value="+3" readonly class="input-cell text-center font-bold diff-output" />
            </td>

            <!-- ダイアフラム 差 -->
            <td class="td-lbl">差</td>
            <td class="td-num"><input type="text" id="dia1_diff" value="+1" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia2_diff" value="-1" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia3_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia4_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia5_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia6_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia7_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia8_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="dia9_diff" value="" readonly class="input-cell text-center font-bold diff-output" /></td>
          </tr>

        </tbody>
      </table>

      <!-- SECTION 2: 断面寸法 & 変形・外観・合否 (CROSS SECTION & DEFORMATION) -->
      <table class="bbox-inspection-table table-bottom-part">
        <thead>
          <!-- SECTION 2 HEADERS -->
          <tr>
            <th colspan="9" class="th-section-title">断 面 寸 法</th>
            <th colspan="2" class="th-sub-section">曲り</th>
            <th class="th-sub-section">ねじれ</th>
            <th rowspan="3" class="col-narrow">板厚</th>
            <th rowspan="3" class="col-narrow">材質</th>
            <th rowspan="3" class="col-narrow">外観<br />検査</th>
            <th rowspan="3" class="col-narrow">合否</th>
            <th rowspan="3" class="col-date">検査日</th>
            <th rowspan="3" class="col-bikou">備考</th>
          </tr>
          <tr>
            <th rowspan="2" class="col-row-lbl"></th>
            <th colspan="4" class="th-column-head">柱 頭</th>
            <th colspan="4" class="th-column-base">柱 脚</th>
            <th rowspan="2" class="th-sub-col">E面</th>
            <th rowspan="2" class="th-sub-col">S面</th>
            <th rowspan="2" class="th-sub-col">δ</th>
          </tr>
          <tr class="th-sub-dir-row">
            <th class="dir-col">N</th>
            <th class="dir-col">S</th>
            <th class="dir-col">E</th>
            <th class="dir-col">W</th>
            <th class="dir-col">N</th>
            <th class="dir-col">S</th>
            <th class="dir-col">E</th>
            <th class="dir-col">W</th>
          </tr>
        </thead>

        <tbody>
          <!-- ROW 1: 設計値 -->
          <tr>
            <td class="td-lbl">設計値</td>
            <td class="td-num"><input type="number" step="0.1" id="head_n_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_s_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_e_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_w_design" value="950" class="input-cell text-center calc-trigger" /></td>

            <td class="td-num"><input type="number" step="0.1" id="base_n_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_s_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_e_design" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_w_design" value="950" class="input-cell text-center calc-trigger" /></td>

            <td class="td-num"><input type="number" step="0.1" id="bend_e_design" value="0" class="input-cell text-center font-bold calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="bend_s_design" value="0" class="input-cell text-center font-bold calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="twist_design" value="0" class="input-cell text-center font-bold calc-trigger" /></td>

            <td rowspan="4" class="td-verdict-col">
              <input type="text" id="thicknessStatus" value="適" class="input-cell text-center font-bold" />
            </td>
            <td rowspan="4" class="td-verdict-col">
              <input type="text" id="materialStatus" value="適" class="input-cell text-center font-bold" />
            </td>
            <td rowspan="4" class="td-verdict-col">
              <input type="text" id="appearanceStatus" value="適" class="input-cell text-center font-bold" />
            </td>
            <td rowspan="4" class="td-verdict-col td-final-verdict">
              <input type="text" id="finalVerdict" value="合" class="input-cell text-center font-bold verdict-pass" />
            </td>
            <td rowspan="4" class="td-date-col text-center">
              <input type="text" id="inspectDate" value="9/4" class="input-cell text-center" />
            </td>
            <td rowspan="4" class="td-bikou-col">
              <textarea id="remarks" class="textarea-cell"></textarea>
            </td>
          </tr>

          <!-- ROW 2: 実測値 -->
          <tr>
            <td class="td-lbl">実測値</td>
            <td class="td-num"><input type="number" step="0.1" id="head_n_actual" value="950" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_s_actual" value="949" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_e_actual" value="951" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="head_w_actual" value="951" class="input-cell text-center calc-trigger" /></td>

            <td class="td-num"><input type="number" step="0.1" id="base_n_actual" value="952" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_s_actual" value="952" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_e_actual" value="953" class="input-cell text-center calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="base_w_actual" value="952" class="input-cell text-center calc-trigger" /></td>

            <td class="td-num"><input type="number" step="0.1" id="bend_e_actual" value="-0.5" class="input-cell text-center font-bold calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="bend_s_actual" value="0" class="input-cell text-center font-bold calc-trigger" /></td>
            <td class="td-num"><input type="number" step="0.1" id="twist_actual" value="1.5" class="input-cell text-center font-bold calc-trigger" /></td>
          </tr>

          <!-- ROW 3: 許容値 (TOLERANCE - RED TEXT) -->
          <tr>
            <td class="td-lbl text-red">許容値</td>
            <td class="td-num text-red"><input type="text" id="head_n_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="head_s_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="head_e_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="head_w_tol" value="±3" class="input-cell text-center text-red" /></td>

            <td class="td-num text-red"><input type="text" id="base_n_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="base_s_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="base_e_tol" value="±3" class="input-cell text-center text-red" /></td>
            <td class="td-num text-red"><input type="text" id="base_w_tol" value="±3" class="input-cell text-center text-red" /></td>

            <td class="td-num text-red"><input type="text" id="bend_e_tol" value="±4.5" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num text-red"><input type="text" id="bend_s_tol" value="±4.5" class="input-cell text-center text-red font-bold" /></td>
            <td class="td-num"><input type="text" id="twist_tol" value="5.0" class="input-cell text-center font-bold" /></td>
          </tr>

          <!-- ROW 4: 差 (DIFFERENCE) -->
          <tr>
            <td class="td-lbl">差</td>
            <td class="td-num"><input type="text" id="head_n_diff" value="0" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="head_s_diff" value="-1" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="head_e_diff" value="+1" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="head_w_diff" value="+1" readonly class="input-cell text-center font-bold diff-output" /></td>

            <td class="td-num"><input type="text" id="base_n_diff" value="+2" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="base_s_diff" value="+2" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="base_e_diff" value="+3" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="base_w_diff" value="+2" readonly class="input-cell text-center font-bold diff-output" /></td>

            <td class="td-num"><input type="text" id="bend_e_diff" value="-0.5" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="bend_s_diff" value="0" readonly class="input-cell text-center font-bold diff-output" /></td>
            <td class="td-num"><input type="text" id="twist_diff" value="1.5" readonly class="input-cell text-center font-bold diff-output" /></td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- SCRIPT LOGIC -->
  <script src="src/app.js"></script>
</body>

</html>
